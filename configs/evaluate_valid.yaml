# Decoding settings of π_ref compared on VALID, to choose the reference decoding before RL.
# Same keys as evaluate.yaml.
data_dir: data/processed
run_dir: runs/eval-valid
split: valid
critics: {}
systems:
    human:
        kind: human
    pi_ref_greedy:
        kind: policy
        model: runs/pretrain/final/best
        restrict_no_chord: true
        greedy: true
        batch_size: 64
    pi_ref_t0.5:
        kind: policy
        model: runs/pretrain/final/best
        restrict_no_chord: true
        temperature: 0.5
        samples: 8
        seed: 0
        batch_size: 64
    pi_ref_t0.7:
        kind: policy
        model: runs/pretrain/final/best
        restrict_no_chord: true
        temperature: 0.7
        samples: 8
        seed: 0
        batch_size: 64
    pi_ref_t0.85:
        kind: policy
        model: runs/pretrain/final/best
        restrict_no_chord: true
        temperature: 0.85
        samples: 8
        seed: 0
        batch_size: 64
    pi_ref_t1:
        kind: policy
        model: runs/pretrain/final/best
        restrict_no_chord: true
        temperature: 1.0
        samples: 8
        seed: 0
        batch_size: 64
