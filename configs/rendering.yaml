# Tool paths and output options for rendering. The fixed voicing, instruments, and
# tempo handling live in src/harmonyrl/render and are shared by every system.
soundfont: /usr/share/sounds/sf2/FluidR3_GM.sf2
mscore: ~/.local/bin/mscore
output_root: runs/render
sample_rate: 44100
gain: 0.5
default_tempo: 120
mp3_bitrate: 192k
