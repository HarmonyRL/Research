# Structure critic. `model` holds CriticConfig fields and `train` CriticArguments fields. `split` is
# `standard` (train on TRAIN, stop on VALID) or `holdout` (TRAIN and VALID pooled and split again).
# Each of `samples_dirs` holds 1 policy sample per melody, the negatives.
data_dir: data/processed
samples_dirs:
    - runs/samples/pi_ref_t1_s0
    - runs/samples/pi_ref_t1_s1
    - runs/samples/pi_ref_t1_s2
    - runs/samples/pi_ref_t1_s3
    - runs/samples/pi_ref_t1_s4
    - runs/samples/pi_ref_t1_s5
    - runs/samples/pi_ref_t1_s6
    - runs/samples/pi_ref_t1_s7
run_dir: runs/critic
seed: 0
split: standard
holdout_fraction: 0.1
model:
    dim: 192
    attention_heads: 4
    layers: 4
    ff_mult: 4
    dropout: 0.1
train:
    max_frames: 8192
    lr: 3.0e-4
    weight_decay: 0.1
    warmup_steps: 300
    max_epochs: 60
    patience: 4
    grad_clip: 1.0
    label_smoothing: 0.1
    section_dropout: 0.2
