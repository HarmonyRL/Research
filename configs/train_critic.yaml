# Structure critic.
defaults:
    - hydra_defaults
    - _self_
name: ${now:%Y%m%d-%H%M%S}
data_dir: data/processed
output_dir: runs/critic/${name}
samples_dirs:
    - runs/samples/pi_ref_t1_s0
    - runs/samples/pi_ref_t1_s1
    - runs/samples/pi_ref_t1_s2
    - runs/samples/pi_ref_t1_s3
    - runs/samples/pi_ref_t1_s4
    - runs/samples/pi_ref_t1_s5
    - runs/samples/pi_ref_t1_s6
    - runs/samples/pi_ref_t1_s7
seed: 0
split: standard
restrict_no_chord: true
holdout_fraction: 0.1
model:
    dim: 192
    attention_heads: 4
    layers: 4
    ff_mult: 4
    dropout: 0.1
train:
    max_frames: 8192
    lr: 3.0e-4
    weight_decay: 0.1
    warmup_steps: 300
    max_epochs: 60
    patience: 4
    grad_clip: 1.0
    label_smoothing: 0.1
    section_dropout: 0.2
