# Policy samples for every melody of the listed splits, as critic negatives.
defaults:
    - hydra_defaults
    - _self_
name: ${now:%Y%m%d-%H%M%S}
data_dir: data/processed
output_dir: runs/samples/${name}
model: runs/pretrain/final/best
restrict_no_chord: true
temperature: 1.0
seed: 0
batch_size: 64
splits: [train, valid]
