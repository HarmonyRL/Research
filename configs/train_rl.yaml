# KL-regularized fine-tuning of π_ref toward chords outside the key, or a learned or local reward.
defaults:
  - hydra_defaults
  - _self_
name: ${now:%Y%m%d-%H%M%S}
data_dir: data/processed
output_dir: runs/rl/${name}
reference: runs/pretrain/final/best
reference_temperature: 0.85
reward_model: runs/reward/main/model
seed: 0
train:
  divergence: reverse
  reward: color
  beta: 0.2
  hold_penalty: 2.0
  clip_reward: 5.0
  updates: 200
  melodies: 32
  samples: 8
  lr: 1.0e-5
  grad_clip: 1.0
  eval_every: 10
  eval_melodies: 64
  save_every: 50
