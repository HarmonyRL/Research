# KL-regularized fine-tuning of π_ref against the structure critic or RL-Chord's local reward.
# `train` holds RLArguments fields. `beta` and `clip_reward` are provisional until the
# experiments.
data_dir: data/processed
reference: runs/pretrain/final/best
critic: runs/critic/main/best
run_dir: runs/rl
seed: 0
train:
    divergence: reverse
    reward: critic
    beta: 0.1
    clip_reward: 2.0
    updates: 200
    melodies: 32
    samples: 8
    lr: 1.0e-5
    grad_clip: 1.0
    eval_every: 10
    eval_melodies: 64
    save_every: 50
