# Structure critic.
defaults:
    - hydra_defaults
    - _self_
name: ${now:%Y%m%d-%H%M%S}
data_dir: data/processed
output_dir: runs/critic/${name}
samples_dirs:
    - runs/samples/pi_ref_t1_s0
    - runs/samples/pi_ref_t1_s1
    - runs/samples/pi_ref_t1_s2
    - runs/samples/pi_ref_t1_s3
    - runs/samples/pi_ref_t1_s4
    - runs/samples/pi_ref_t1_s5
    - runs/samples/pi_ref_t1_s6
    - runs/samples/pi_ref_t1_s7
seed: 0
split: standard
restrict_no_chord: true
holdout_fraction: 0.1
model:
    backbone: manoskary/musicbert
    backbone_revision: 345aee2cc65c1bf3018889e7e78bf88c162267d2
    tokenizer: manoskary/miditok-REMI
    tokenizer_revision: c7ac1609de2919d32f8f295118b3fbbfa9c2b132
    max_tokens: 1024
train:
    batch_tokens: 8192
    lr: 2.0e-5
    weight_decay: 0.01
    warmup_steps: 200
    max_epochs: 6
    patience: 2
    grad_clip: 1.0
    label_smoothing: 0.1
