# Preference reward: linear heads over a frozen encoder, fit to the preference comparisons.
defaults:
  - hydra_defaults
  - _self_
name: ${now:%Y%m%d-%H%M%S}
output_dir: runs/reward/${name}
rounds:
  - data/preferences/valid-b32
  - data/preferences/valid-bp
  - data/preferences/round-1
  - data/preferences/round-2
seed: 0
model:
  features: likelihood
  policy: runs/pretrain/final/best
  backbone: data/pretrained/musicbert
  tokenizer: data/pretrained/miditok-REMI
  max_tokens: 1024
  heads: 5
train:
  l2: 20.0
  steps: 200
  folds: null
  curve: [0.25, 0.5, 0.75, 1.0]
  batch_size: 64
  transpositions: []
  consistency: 0.0
  pseudo_margin: null
  pseudo_weight: 0.5
