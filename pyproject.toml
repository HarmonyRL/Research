[project]
name = "harmonyrl"
version = "0.1.0"
description = "Melody harmonization with reinforcement learning"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "CloudHolic", email = "cloudholic@pm.me" }]
requires-python = ">=3.14"
dependencies = [
	"homr>=0.7.0",
	"huggingface-hub>=2.2.0",
	"hydra-core==1.4.0rc3",
	"librosa>=1.0.0",
	"miditok>=3.1.0",
	"music21>=10.5.0",
	"numpy>=2.5.4",
	"omegaconf>=2.4.1rc2",
	"pretty-midi>=0.2.11.post0",
	"pyyaml>=6.0.3",
	"safetensors>=0.8.0",
	"streamlit>=1.66.1",
	"symusic>=0.6.0",
	"torch>=2.14.1",
	"transformers>=5.22.1",
	"typer>=0.27.3",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.1", "ty>=0.0.90"]
notebook = ["ipykernel>=7.4.0", "matplotlib>=3.11.2", "polars>=2.1.0"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harmonyrl"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[tool.ruff.lint]
select = [
	"E",
	"F",
	"I",
	"A",
	"B",
	"C4",
	"N",
	"NPY",
	"PIE",
	"RET",
	"RUF",
	"SIM",
	"UP",
]

[[tool.ty.overrides]]
include = ["src/harmonyrl/models", "src/harmonyrl/rl"]

[tool.ty.overrides.rules]
invalid-mutable-override = "ignore"

[tool.uv]
default-groups = ["dev", "notebook"]
